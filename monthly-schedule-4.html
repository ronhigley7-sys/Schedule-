<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Staff Schedule</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --border: #b0b8c1;
    --border-dark: #6b7a8d;
    --rn-color: #1a3a5c;
    --lpn-color: #2e6e4e;
    --ca-color: #7a3b1e;
    --day-bg: #eaf3fb;
    --night-bg: #e8f0e8;
    --eve1-bg: #fef3e2;
    --eve2-bg: #fde8e8;
    --header-bg: #1e2d3d;
    --header-text: #ffffff;
    --section-rn: #dce8f5;
    --section-lpn: #d4eed9;
    --section-ca: #fce8d4;
    --row-alt: #f7f9fc;
    --weekend-bg: #f0f0f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 8px;
    background: #e8ecef;
    padding: 10px;
  }

  /* ── CONTROLS (screen only) ── */
  .controls {
    background: #1e2d3d;
    color: #fff;
    padding: 14px 20px;
    border-radius: 8px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .controls label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 3px; color: #a8c4e0; }
  .controls input, .controls select {
    background: #2e4260;
    border: 1px solid #4a6080;
    color: #fff;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: 'Barlow', sans-serif;
  }
  .controls input[type="number"] { width: 56px; }
  .controls input[type="text"] { width: 120px; }
  .ctrl-group { display: flex; flex-direction: column; }
  .controls button {
    background: #e8a020;
    color: #1e2d3d;
    border: none;
    padding: 7px 16px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
    margin-top: auto;
  }
  .controls button:hover { background: #f0b030; }
  .print-btn {
    background: #2e7d52 !important;
    color: #fff !important;
    margin-left: auto;
  }
  .print-btn:hover { background: #3a9662 !important; }
  .week-btn {
    background: #5a3a8a !important;
    color: #fff !important;
  }
  .week-btn:hover { background: #6e4aaa !important; }

  /* ── SCHEDULE PAGE ── */
  .schedule-page {
    background: #fff;
    width: 14in;
    min-height: 8in;
    padding: 0.25in 0.2in;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #1e2d3d;
    padding-bottom: 6px;
    margin-bottom: 8px;
  }
  .page-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #1e2d3d;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .page-subtitle {
    font-size: 10px;
    color: #5a6a7a;
    margin-top: 1px;
    font-weight: 500;
  }
  .header-meta {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .meta-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 8px;
    color: #5a6a7a;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .meta-field span {
    border-bottom: 1.5px solid #1e2d3d;
    min-width: 100px;
    height: 16px;
    margin-top: 2px;
    font-size: 11px;
    color: #1e2d3d;
    font-weight: 700;
    font-family: 'Barlow Condensed', sans-serif;
  }

  /* ── LEGEND ── */
  .legend {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 7.5px;
    font-weight: 600;
    color: #3a4a5a;
  }
  .legend-swatch {
    width: 14px;
    height: 10px;
    border-radius: 2px;
    border: 1px solid var(--border);
  }
  .legend-swatch.day  { background: var(--day-bg); }
  .legend-swatch.night { background: var(--night-bg); }
  .legend-swatch.eve1 { background: var(--eve1-bg); }
  .legend-swatch.eve2 { background: var(--eve2-bg); }

  /* ── MAIN TABLE ── */
  .schedule-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  /* column widths */
  .col-role   { width: 32px; }
  .col-shift  { width: 28px; }
  .col-name   { width: 88px; }
  .col-day    { /* remaining distributed evenly */ }

  /* header row */
  .schedule-table thead tr.month-header th {
    background: var(--header-bg);
    color: var(--header-text);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    text-align: center;
    padding: 3px 1px;
    border: 1px solid #3a4a5a;
    letter-spacing: 0.3px;
  }
  .schedule-table thead tr.month-header th.col-name {
    text-align: left;
    padding-left: 4px;
  }

  /* day-of-week sub-header */
  .schedule-table thead tr.dow-header th {
    font-size: 6.5px;
    font-weight: 600;
    text-align: center;
    padding: 1px;
    border: 1px solid var(--border);
    color: #5a6a7a;
    background: #f4f6f8;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .dow-header th.weekend { background: var(--weekend-bg); color: #8a5a5a; }

  /* section label rows */
  .section-row td {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 3px 4px;
    border: 1px solid var(--border-dark);
  }
  .section-row.rn  td { background: var(--section-rn);  color: var(--rn-color); }
  .section-row.lpn td { background: var(--section-lpn); color: var(--lpn-color); }
  .section-row.ca  td { background: var(--section-ca);  color: var(--ca-color); }

  /* data rows */
  .schedule-table tbody tr.data-row td {
    border: 1px solid var(--border);
    padding: 0;
    height: 14px;
    vertical-align: middle;
  }
  .schedule-table tbody tr.data-row:nth-child(even) td.name-cell {
    background: var(--row-alt);
  }

  td.role-cell {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 8px;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
    vertical-align: middle;
    padding: 0 2px;
    letter-spacing: 0.5px;
  }
  td.role-cell.rn  { color: var(--rn-color);  background: #f0f5fb; }
  td.role-cell.lpn { color: var(--lpn-color); background: #f0f8f2; }
  td.role-cell.ca  { color: var(--ca-color);  background: #fdf5ef; }

  td.shift-cell {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 7px;
    font-weight: 600;
    text-align: center;
    vertical-align: middle;
    padding: 0 1px;
    white-space: nowrap;
    color: #3a4a5a;
  }
  td.shift-cell.day   { background: var(--day-bg);   color: #1a4a7a; }
  td.shift-cell.night { background: var(--night-bg); color: #1a5a30; }
  td.shift-cell.eve1  { background: var(--eve1-bg);  color: #7a4a10; }
  td.shift-cell.eve2  { background: var(--eve2-bg);  color: #8a2020; }

  td.name-cell {
    padding: 0 4px;
    font-size: 7.5px;
    font-weight: 500;
    color: #2a3a4a;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .badge-48 {
    display: inline-block;
    background: #dc2626;
    color: #fff;
    font-size: 5.5px;
    font-weight: 800;
    font-family: 'Barlow Condensed', sans-serif;
    padding: 0px 2px;
    border-radius: 2px;
    margin-left: 2px;
    vertical-align: middle;
    line-height: 1.4;
    letter-spacing: 0.3px;
  }
  .fte-label {
    font-size: 5.5px;
    color: #8a9aaa;
    margin-left: 3px;
    font-style: italic;
    font-family: 'Barlow Condensed', sans-serif;
  }

  td.day-cell {
    text-align: center;
    vertical-align: middle;
    font-size: 7px;
    color: #3a4a5a;
    cursor: text;
  }
  td.day-cell.weekend { background: var(--weekend-bg); }
  td.day-cell.day-shift   { background: var(--day-bg); }
  td.day-cell.night-shift { background: var(--night-bg); }
  td.day-cell.eve1-shift  { background: var(--eve1-bg); }
  td.day-cell.eve2-shift  { background: var(--eve2-bg); }

  /* ── TOTAL ROWS ── */
  tr.total-row td {
    border: 1px solid var(--border-dark);
    height: 13px;
    vertical-align: middle;
    padding: 0;
  }
  td.total-label-role {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 7px;
    font-weight: 800;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    vertical-align: middle;
  }
  td.total-label-role.rn  { background: var(--section-rn);  color: var(--rn-color); }
  td.total-label-role.lpn { background: var(--section-lpn); color: var(--lpn-color); }
  td.total-label-role.ca  { background: var(--section-ca);  color: var(--ca-color); }
  td.total-label-shift {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 7px;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
    vertical-align: middle;
    padding: 0 2px;
    white-space: nowrap;
  }
  td.total-label-shift.day   { background: #c8dff5; color: #1a3a6a; }
  td.total-label-shift.night { background: #c0dcc8; color: #1a4a28; }
  td.total-label-shift.eve1  { background: #fddcaa; color: #7a3a00; }
  td.total-label-shift.eve2  { background: #f8c8c8; color: #7a1a1a; }
  td.total-name-cell {
    background: #f0f2f5;
    font-size: 6.5px;
    font-style: italic;
    color: #8a9aaa;
    text-align: center;
    padding: 0 2px;
  }
  td.total-name-cell::after { content: '# Staff'; }
  td.total-day-cell {
    text-align: center;
    vertical-align: middle;
    font-size: 8px;
    font-weight: 700;
    font-family: 'Barlow Condensed', sans-serif;
    color: #2a3a4a;
    background: #f5f7fa;
    border: 1px solid var(--border-dark);
    cursor: text;
  }
  td.total-day-cell.weekend { background: #e8e8e8; }

  /* shift code key row */
  .code-key-row td {
    font-size: 6.5px;
    color: #6a7a8a;
    padding: 4px 2px 2px;
    border: none;
    text-align: center;
  }

  /* ── FOOTER ── */
  .page-footer {
    margin-top: 8px;
    border-top: 1px solid var(--border);
    padding-top: 4px;
    display: flex;
    justify-content: space-between;
    font-size: 7px;
    color: #8a9aaa;
  }
  .shift-codes-box {
    display: flex;
    gap: 12px;
  }
  .shift-code-item {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 7.5px;
    font-weight: 600;
  }
  .code-badge {
    display: inline-block;
    padding: 1px 4px;
    border-radius: 2px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 8px;
    font-weight: 700;
    border: 1px solid var(--border);
  }
  .code-badge.O  { background: #fff3cd; color: #856404; }
  .code-badge.V  { background: #d1ecf1; color: #0c5460; }
  .code-badge.F  { background: #d4edda; color: #155724; }
  .code-badge.CA2 { background: #e2d9f3; color: #4a235a; }
  .code-badge.PTO { background: #fce8e8; color: #721c24; }
  .code-badge.OT { background: #ffe8cc; color: #7a3b00; }

  /* ── PRINT ── */
  @media print {
    @page {
      size: 14in 8.5in landscape;
      margin: 0.2in 0.15in;
    }
    body {
      background: #fff;
      padding: 0;
      font-size: 7.5px;
    }
    .controls { display: none !important; }
    .schedule-page {
      width: 100%;
      padding: 0;
      box-shadow: none;
    }
    td.day-cell, td.shift-cell, td.role-cell, td.name-cell {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
  /* Week print window styles — used in popup */
  .week-print-page {
    font-family: 'Barlow', sans-serif;
    font-size: 8px;
    background: #fff;
    padding: 0.3in 0.25in;
  }
  .week-print-page .schedule-table { font-size: 8.5px; }
</style>
</head>
<body>

<!-- ══ CONTROLS ══ -->
<div class="controls" id="controls">
  <div class="ctrl-group">
    <label>Unit / Department</label>
    <input type="text" id="unitName" value="Unit Name" style="width:150px;">
  </div>
  <div class="ctrl-group">
    <label>Month</label>
    <input type="month" id="monthInput">
  </div>
  <div class="ctrl-group">
    <label># RN rows</label>
    <input type="number" id="rnCount" value="12" min="1" max="30">
  </div>
  <div class="ctrl-group">
    <label># LPN rows</label>
    <input type="number" id="lpnCount" value="4" min="0" max="20">
  </div>
  <div class="ctrl-group">
    <label># CA rows</label>
    <input type="number" id="caCount" value="8" min="0" max="20">
  </div>
  <button onclick="buildSchedule()">⟳ Rebuild</button>
  <button onclick="fetchStaff()" style="background:#3a6aaa;color:#fff;border:none;padding:7px 14px;border-radius:4px;font-weight:700;font-size:11px;cursor:pointer;font-family:Barlow,sans-serif;">↓ Reload Staff</button>
  <span id="staffStatus" style="font-size:10px;color:#a8c4e0;align-self:center;">Not loaded</span>
  <div style="width:1px;background:#3a5070;align-self:stretch;margin:0 4px;"></div>
  <div class="ctrl-group">
    <label>Print Week</label>
    <select id="weekSelect" style="width:175px;background:#2e4260;border:1px solid #4a6080;color:#fff;padding:5px 8px;border-radius:4px;font-size:11px;font-family:Barlow,sans-serif;"></select>
  </div>
  <button class="week-btn" onclick="printWeek()">🖨 Print Week (8.5×11)</button>
  <button class="print-btn" onclick="window.print()">🖨 Print Full Month (8×14)</button>
</div>

<!-- ══ SCHEDULE PAGE ══ -->
<div class="schedule-page" id="schedulePage"></div>

<script>
// ── helpers ──────────────────────────────────────────────────────────────
const DAYS_ABBR  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS     = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];

function getDaysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}
function getFirstDayOfWeek(year, month) {
  return new Date(year, month, 1).getDay();
}

// shift definitions
const RN_SHIFTS  = [
  { key:'day',   label:'0700–1900', abbr:'D', cls:'day' },
  { key:'night', label:'1900–0700', abbr:'N', cls:'night' },
];
const LPN_SHIFTS = [
  { key:'day',   label:'0700–1900', abbr:'D', cls:'day' },
  { key:'night', label:'1900–0700', abbr:'N', cls:'night' },
];
const CA_SHIFTS  = [
  { key:'day',   label:'0630–1430', abbr:'D',  cls:'day' },
  { key:'eve1',  label:'1430–1830', abbr:'E1', cls:'eve1' },
  { key:'eve2',  label:'1830–2230', abbr:'E2', cls:'eve2' },
  { key:'night', label:'2230–0530', abbr:'N',  cls:'night' },
];

// ── Supabase config ──────────────────────────────────────────────────────
const SUPA_URL  = 'https://xnsdvdfceflmagfhpycw.supabase.co';
const SUPA_KEY  = 'sb_publishable_X3VPp9di5Ve-fw_uJJTUyQ_Ztzi6mds';

// staffData keyed by role: { RN: [...], LPN: [...], CA: [...] }
// each entry: { name: 'Last, First', fte: 0.9, is48hr: true }
let staffData = { RN: [], LPN: [], CA: [] };
let staffLoaded = false;

async function fetchStaff() {
  const statusEl = document.getElementById('staffStatus');
  statusEl.textContent = '⏳ Loading staff…';
  try {
    // CC stores all state in tracker_state table, key='app_state', value is JSON blob
    const res = await fetch(
      `${SUPA_URL}/rest/v1/tracker_state?key=eq.app_state&select=value`,
      { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (!rows.length) throw new Error('No app_state found');

    const appState = typeof rows[0].value === 'string'
      ? JSON.parse(rows[0].value)
      : rows[0].value;

    // MASTER_STAFF equivalent lives in appState — could be staffList, staff, or roster
    // Find the array of staff objects with .name and .job
    let rawStaff = appState.staffList || appState.staff || appState.roster || [];
    if (!Array.isArray(rawStaff)) rawStaff = [];

    const emp48hr = appState.emp48hr || {};
    const empFTE  = appState.empFTE  || {};

    // Deduplicate (same logic as CC)
    const seen = new Set(), removed = new Set(appState.removedStaff || []);
    rawStaff = rawStaff.filter(s => {
      if (!s.name || seen.has(s.name) || removed.has(s.name)) return false;
      seen.add(s.name);
      return true;
    });

    // Filter to RN/LPN/CA only, exclude UC/NM
    const SKIP_JOBS = ['UC','NM','NURSE MGR'];
    staffData = { RN: [], LPN: [], CA: [] };
    rawStaff
      .filter(s => !SKIP_JOBS.includes((s.job||'').toUpperCase()))
      .forEach(s => {
        const role = (s.job || '').trim().toUpperCase();
        if (!['RN','LPN','CA'].includes(role)) return;
        const fte   = parseFloat(empFTE[s.name]) || 0.9;
        const is48  = !!(emp48hr[s.name]);
        staffData[role].push({ name: s.name, fte, is48 });
      });

    // Sort alphabetically by last name (already "Last, First" format)
    ['RN','LPN','CA'].forEach(r => staffData[r].sort((a,b) => a.name.localeCompare(b.name)));

    staffLoaded = true;
    const total = staffData.RN.length + staffData.LPN.length + staffData.CA.length;
    statusEl.textContent = `✓ ${total} staff loaded — RN:${staffData.RN.length} LPN:${staffData.LPN.length} CA:${staffData.CA.length}`;
    statusEl.style.color = '#4ade80';
    buildSchedule();
    populateWeekSelect();
  } catch(e) {
    statusEl.textContent = `⚠ Could not load staff: ${e.message}`;
    statusEl.style.color = '#f87171';
    console.error('fetchStaff error:', e);
    buildSchedule();
    populateWeekSelect();
  }
}

// ── main builder ─────────────────────────────────────────────────────────
function buildSchedule() {
  const unitName = document.getElementById('unitName').value || 'Unit Name';
  const rnCount  = parseInt(document.getElementById('rnCount').value)  || 12;
  const lpnCount = parseInt(document.getElementById('lpnCount').value) || 4;
  const caCount  = parseInt(document.getElementById('caCount').value)  || 8;

  const monthInput = document.getElementById('monthInput').value;
  let year, month;
  if (monthInput) {
    [year, month] = monthInput.split('-').map(Number);
    month -= 1; // 0-indexed
  } else {
    const now = new Date();
    year  = now.getFullYear();
    month = now.getMonth();
  }

  const daysInMonth   = getDaysInMonth(year, month);
  const firstDOW      = getFirstDayOfWeek(year, month);
  const monthLabel    = `${MONTHS[month]} ${year}`;
  const days          = Array.from({length: daysInMonth}, (_,i) => i+1);

  // DOW for each day
  const dayDOW = days.map(d => (firstDOW + d - 1) % 7);
  const isWeekend = dayDOW.map(dow => dow === 0 || dow === 6);

  // colgroup
  function makeColgroup() {
    let cg = '<colgroup>';
    cg += '<col style="width:28px">';   // role
    cg += '<col style="width:28px">';   // shift
    cg += '<col style="width:90px">';   // name
    const dayW = `${(100 - 0).toFixed(1)}%`;
    days.forEach(() => cg += `<col style="width:auto">`);
    cg += '</colgroup>';
    return cg;
  }

  // header rows
  function makeHeaderRows() {
    let html = '<thead>';

    // Row 1: month + day numbers
    html += '<tr class="month-header">';
    html += `<th class="col-role" colspan="2">ROLE / SHIFT</th>`;
    html += `<th class="col-name">${unitName} &mdash; ${monthLabel}</th>`;
    days.forEach((d, i) => {
      const wknd = isWeekend[i] ? ' style="background:#2e3d50"' : '';
      html += `<th${wknd}>${d}</th>`;
    });
    html += '</tr>';

    // Row 2: day of week abbreviation
    html += '<tr class="dow-header">';
    html += '<th colspan="2"></th>';
    html += '<th>Staff Name</th>';
    days.forEach((_, i) => {
      const cls = isWeekend[i] ? ' class="weekend"' : '';
      html += `<th${cls}>${DAYS_ABBR[dayDOW[i]]}</th>`;
    });
    html += '</tr>';

    html += '</thead>';
    return html;
  }

  // section header row
  function makeSectionRow(label, cls, colSpan) {
    return `<tr class="section-row ${cls}"><td colspan="${colSpan}">${label}</td></tr>`;
  }

  // staff data rows — pulls from staffData if loaded, else blank rows
  function makeStaffRows(shifts, role, cls, count) {
    const pool = (staffData[role] || []).slice(); // already alpha sorted
    // Expand count to fit all staff if more than configured rows
    const total = Math.max(count, pool.length);
    let html = '';
    for (let i = 0; i < total; i++) {
      const shift = shifts[i % shifts.length];
      const staff = pool[i] || null;
      html += `<tr class="data-row">`;
      if (i === 0) {
        html += `<td class="role-cell ${cls}" rowspan="${total}">${role}</td>`;
      }
      html += `<td class="shift-cell ${shift.cls}" title="${shift.label} shift">${shift.abbr}<br><span style="font-size:5.5px;letter-spacing:0">${shift.label}</span></td>`;
      if (staff) {
        const badge48 = staff.is48 ? ` <span class="badge-48">48</span>` : '';
        const fteLabel = staff.fte >= 48 ? `${staff.fte}h` : (staff.fte > 0 ? `${(staff.fte*100).toFixed(0)}%` : '');
        html += `<td class="name-cell">${staff.name}${badge48}<span class="fte-label">${fteLabel}</span></td>`;
      } else {
        html += `<td class="name-cell"></td>`;
      }
      days.forEach((_, di) => {
        const wknd = isWeekend[di] ? ' weekend' : '';
        html += `<td class="day-cell${wknd} ${shift.cls}-shift" contenteditable="true"></td>`;
      });
      html += `</tr>`;
    }
    return html;
  }

  // totals rows — one per unique shift in the group
  function makeTotalRows(shifts, cls) {
    const seen = new Set();
    const unique = shifts.filter(s => { if (seen.has(s.key)) return false; seen.add(s.key); return true; });
    let html = '';
    unique.forEach((shift, idx) => {
      html += `<tr class="total-row">`;
      if (idx === 0) {
        html += `<td class="total-label-role ${cls}" rowspan="${unique.length}">TOTAL</td>`;
      }
      html += `<td class="total-label-shift ${shift.cls}">${shift.abbr} Total</td>`;
      html += `<td class="total-name-cell"></td>`;
      days.forEach((_, di) => {
        const wknd = isWeekend[di] ? ' weekend' : '';
        html += `<td class="total-day-cell${wknd ? ' weekend' : ''}" contenteditable="true"></td>`;
      });
      html += `</tr>`;
    });
    return html;
  }

  const totalCols = 3 + daysInMonth;

  let html = '';

  // ── page header
  html += `
  <div class="page-header">
    <div>
      <div class="page-title">Monthly Staff Schedule</div>
      <div class="page-subtitle">${unitName} &mdash; ${monthLabel} &mdash; RN/LPN: D=0700–1900 &nbsp; N=1900–0700 &nbsp;|&nbsp; CA: D=0630–1430 &nbsp; E1=1430–1830 &nbsp; E2=1830–2230 &nbsp; N=2230–0530</div>
    </div>
    <div class="header-meta">
      <div class="meta-field">Manager<span></span></div>
      <div class="meta-field">Approved By<span></span></div>
      <div class="meta-field">Posted Date<span></span></div>
    </div>
  </div>`;

  // ── legend
  html += `
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch day"></div>Day — RN/LPN (0700–1900) &nbsp;|&nbsp; CA (0630–1430)</div>
    <div class="legend-item"><div class="legend-swatch eve1"></div>CA Eve 1 (1430–1830)</div>
    <div class="legend-item"><div class="legend-swatch eve2"></div>CA Eve 2 (1830–2230)</div>
    <div class="legend-item"><div class="legend-swatch night"></div>Night — RN/LPN (1900–0700) &nbsp;|&nbsp; CA (2230–0530)</div>
    <div class="legend-item" style="margin-left:16px"><span style="font-weight:700;color:#856404">O</span>=Off&nbsp;&nbsp;<span style="font-weight:700;color:#0c5460">V</span>=Vac&nbsp;&nbsp;<span style="font-weight:700;color:#155724">F</span>=Float&nbsp;&nbsp;<span style="font-weight:700;color:#721c24">PTO</span>=PTO&nbsp;&nbsp;<span style="font-weight:700;color:#7a3b00">OT</span>=OT&nbsp;&nbsp;<span style="font-weight:700;color:#4a235a">×</span>=Call-off</div>
  </div>`;

  // ── table
  html += `<table class="schedule-table">`;
  html += makeColgroup();
  html += makeHeaderRows();
  html += '<tbody>';

  // RN section
  html += makeSectionRow('Registered Nurses (RN) — Day (0700–1900) / Night (1900–0700)', 'rn', totalCols);
  html += makeStaffRows(RN_SHIFTS, 'RN', 'rn', rnCount);
  html += makeTotalRows(RN_SHIFTS, 'rn');

  // LPN section
  if (lpnCount > 0) {
    html += makeSectionRow('Licensed Practical Nurses (LPN) — Day (0700–1900) / Night (1900–0700)', 'lpn', totalCols);
    html += makeStaffRows(LPN_SHIFTS, 'LPN', 'lpn', lpnCount);
    html += makeTotalRows(LPN_SHIFTS, 'lpn');
  }

  // CA section
  if (caCount > 0) {
    html += makeSectionRow('Clinical Assistants (CA) — Day (0630–1430) / Eve 1 (1430–1830) / Eve 2 (1830–2230) / Night (2230–0530)', 'ca', totalCols);
    html += makeStaffRows(CA_SHIFTS, 'CA', 'ca', caCount);
    html += makeTotalRows(CA_SHIFTS, 'ca');
  }

  html += '</tbody></table>';

  // ── footer
  html += `
  <div class="page-footer">
    <div class="shift-codes-box">
      <span style="font-weight:700;color:#3a4a5a;font-size:8px;">CODES:</span>
      <div class="shift-code-item"><span class="code-badge O">O</span> Scheduled Off</div>
      <div class="shift-code-item"><span class="code-badge V">V</span> Vacation</div>
      <div class="shift-code-item"><span class="code-badge PTO">PTO</span> Paid Time Off</div>
      <div class="shift-code-item"><span class="code-badge F">F</span> Float / Pulled</div>
      <div class="shift-code-item"><span class="code-badge OT">OT</span> Overtime</div>
      <div class="shift-code-item"><span class="code-badge CA2">×</span> Call-off</div>
    </div>
    <div style="font-size:7px;color:#9aabb8;font-style:italic">Cells are editable on screen before printing</div>
  </div>`;

  document.getElementById('schedulePage').innerHTML = html;
}

// ── week select population ────────────────────────────────────────────────
function populateWeekSelect() {
  const monthInput = document.getElementById('monthInput').value;
  let year, month;
  if (monthInput) {
    [year, month] = monthInput.split('-').map(Number);
    month -= 1;
  } else {
    const d = new Date();
    year = d.getFullYear(); month = d.getMonth();
  }
  const daysInMonth = getDaysInMonth(year, month);
  const firstDOW = getFirstDayOfWeek(year, month);
  const sel = document.getElementById('weekSelect');
  sel.innerHTML = '';
  // Build week buckets (Sun-Sat)
  let weekStart = 1;
  while (weekStart <= daysInMonth) {
    const startDOW = (firstDOW + weekStart - 1) % 7;
    const daysUntilSat = startDOW === 0 ? 6 : 7 - startDOW;
    const weekEnd = Math.min(weekStart + daysUntilSat - 1, daysInMonth);
    // pad to always show full Sun-Sat range label
    const startDate = new Date(year, month, weekStart);
    const endDate = new Date(year, month, weekEnd);
    const fmt = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
    const opt = document.createElement('option');
    opt.value = `${weekStart},${weekEnd}`;
    opt.textContent = `${fmt(startDate)} – ${fmt(endDate)}`;
    sel.appendChild(opt);
    weekStart = weekEnd + 1;
  }
}

// ── week print ────────────────────────────────────────────────────────────
function printWeek() {
  const unitName = document.getElementById('unitName').value || 'Unit Name';
  const rnCount  = parseInt(document.getElementById('rnCount').value)  || 12;
  const lpnCount = parseInt(document.getElementById('lpnCount').value) || 4;
  const caCount  = parseInt(document.getElementById('caCount').value)  || 8;
  const monthInput = document.getElementById('monthInput').value;
  let year, month;
  if (monthInput) {
    [year, month] = monthInput.split('-').map(Number);
    month -= 1;
  } else {
    const d = new Date();
    year = d.getFullYear(); month = d.getMonth();
  }
  const [wStart, wEnd] = document.getElementById('weekSelect').value.split(',').map(Number);
  const monthLabel = `${MONTHS[month]} ${year}`;
  const firstDOW = getFirstDayOfWeek(year, month);

  // Only the days in this week
  const weekDays = Array.from({length: wEnd - wStart + 1}, (_, i) => wStart + i);
  const weekDOW  = weekDays.map(d => (firstDOW + d - 1) % 7);
  const weekWknd = weekDOW.map(dow => dow === 0 || dow === 6);
  const totalCols = 3 + weekDays.length;

  function makeWeekColgroup() {
    let cg = '<colgroup>';
    cg += '<col style="width:32px">';
    cg += '<col style="width:34px">';
    cg += '<col style="width:110px">';
    weekDays.forEach(() => cg += '<col style="width:auto">');
    cg += '</colgroup>';
    return cg;
  }

  function makeWeekHeader() {
    let html = '<thead>';
    html += '<tr class="month-header">';
    html += '<th colspan="2">ROLE / SHIFT</th>';
    html += `<th>${unitName} &mdash; ${monthLabel}</th>`;
    weekDays.forEach((d, i) => {
      const wknd = weekWknd[i] ? ' style="background:#2e3d50"' : '';
      html += `<th${wknd}>${d}</th>`;
    });
    html += '</tr>';
    html += '<tr class="dow-header">';
    html += '<th colspan="2"></th>';
    html += '<th>Staff Name</th>';
    weekDays.forEach((_, i) => {
      const cls = weekWknd[i] ? ' class="weekend"' : '';
      html += `<th${cls}>${DAYS_ABBR[weekDOW[i]]}</th>`;
    });
    html += '</tr></thead>';
    return html;
  }

  function makeWeekSectionRow(label, cls) {
    return `<tr class="section-row ${cls}"><td colspan="${totalCols}">${label}</td></tr>`;
  }

  function makeWeekStaffRows(shifts, role, cls, count) {
    const pool = (staffData[role] || []).slice();
    const total = Math.max(count, pool.length);
    let html = '';
    for (let i = 0; i < total; i++) {
      const shift = shifts[i % shifts.length];
      const staff = pool[i] || null;
      html += '<tr class="data-row">';
      if (i === 0) html += `<td class="role-cell ${cls}" rowspan="${total}">${role}</td>`;
      html += `<td class="shift-cell ${shift.cls}">${shift.abbr}<br><span style="font-size:5.5px">${shift.label}</span></td>`;
      if (staff) {
        const badge48 = staff.is48 ? ` <span class="badge-48">48</span>` : '';
        const fteLabel = staff.fte >= 48 ? `${staff.fte}h` : (staff.fte > 0 ? `${(staff.fte*100).toFixed(0)}%` : '');
        html += `<td class="name-cell">${staff.name}${badge48}<span class="fte-label">${fteLabel}</span></td>`;
      } else {
        html += '<td class="name-cell"></td>';
      }
      weekDays.forEach((_, di) => {
        const wknd = weekWknd[di] ? ' weekend' : '';
        html += `<td class="day-cell${wknd} ${shift.cls}-shift" style="width:auto"></td>`;
      });
      html += '</tr>';
    }
    return html;
  }

  function makeWeekTotalRows(shifts, cls) {
    const seen = new Set();
    const unique = shifts.filter(s => { if (seen.has(s.key)) return false; seen.add(s.key); return true; });
    let html = '';
    unique.forEach((shift, idx) => {
      html += '<tr class="total-row">';
      if (idx === 0) html += `<td class="total-label-role ${cls}" rowspan="${unique.length}" style="-webkit-print-color-adjust:exact;print-color-adjust:exact">TOTAL</td>`;
      html += `<td class="total-label-shift ${shift.cls}">${shift.abbr} Total</td>`;
      html += '<td class="total-name-cell"></td>';
      weekDays.forEach((_, di) => {
        const wknd = weekWknd[di] ? ' weekend' : '';
        html += `<td class="total-day-cell${wknd ? ' weekend' : ''}"></td>`;
      });
      html += '</tr>';
    });
    return html;
  }

  const startFmt = new Date(year, month, wStart).toLocaleDateString('en-US', {month:'long', day:'numeric'});
  const endFmt   = new Date(year, month, wEnd).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});

  let body = `
  <div class="page-header" style="margin-bottom:6px">
    <div>
      <div class="page-title" style="font-size:15px">Weekly Staff Schedule</div>
      <div class="page-subtitle">${unitName} &mdash; ${startFmt} &ndash; ${endFmt}</div>
      <div class="page-subtitle" style="margin-top:2px">RN/LPN: D=0700–1900 N=1900–0700 &nbsp;|&nbsp; CA: D=0630–1430 E1=1430–1830 E2=1830–2230 N=2230–0530</div>
    </div>
    <div class="header-meta">
      <div class="meta-field">Manager<span></span></div>
      <div class="meta-field">Approved By<span></span></div>
    </div>
  </div>
  <div class="legend" style="margin-bottom:4px">
    <div class="legend-item"><div class="legend-swatch day"></div>Day RN/LPN (0700–1900) | CA (0630–1430)</div>
    <div class="legend-item"><div class="legend-swatch eve1"></div>CA Eve 1 (1430–1830)</div>
    <div class="legend-item"><div class="legend-swatch eve2"></div>CA Eve 2 (1830–2230)</div>
    <div class="legend-item"><div class="legend-swatch night"></div>Night RN/LPN (1900–0700) | CA (2230–0530)</div>
    <div class="legend-item" style="margin-left:12px;font-size:7px"><b style="color:#856404">O</b>=Off &nbsp;<b style="color:#0c5460">V</b>=Vac &nbsp;<b style="color:#721c24">PTO</b>=PTO &nbsp;<b style="color:#155724">F</b>=Float &nbsp;<b style="color:#7a3b00">OT</b>=OT &nbsp;<b style="color:#4a235a">×</b>=Call-off</div>
  </div>
  <table class="schedule-table" style="font-size:9px">
    ${makeWeekColgroup()}
    ${makeWeekHeader()}
    <tbody>
      ${makeWeekSectionRow('Registered Nurses (RN) — Day (0700–1900) / Night (1900–0700)', 'rn')}
      ${makeWeekStaffRows(RN_SHIFTS, 'RN', 'rn', rnCount)}
      ${makeWeekTotalRows(RN_SHIFTS, 'rn')}
      ${lpnCount > 0 ? makeWeekSectionRow('Licensed Practical Nurses (LPN) — Day (0700–1900) / Night (1900–0700)', 'lpn') + makeWeekStaffRows(LPN_SHIFTS, 'LPN', 'lpn', lpnCount) + makeWeekTotalRows(LPN_SHIFTS, 'lpn') : ''}
      ${caCount > 0 ? makeWeekSectionRow('Clinical Assistants (CA) — Day (0630–1430) / Eve 1 (1430–1830) / Eve 2 (1830–2230) / Night (2230–0530)', 'ca') + makeWeekStaffRows(CA_SHIFTS, 'CA', 'ca', caCount) + makeWeekTotalRows(CA_SHIFTS, 'ca') : ''}
    </tbody>
  </table>
  <div class="page-footer" style="margin-top:6px">
    <div style="font-size:7px;color:#6a7a8a;font-style:italic">Week of ${startFmt} &ndash; ${endFmt} &nbsp;|&nbsp; Print: Letter 8.5×11, Portrait</div>
  </div>`;

  // Grab all styles from current page
  const styles = Array.from(document.styleSheets)
    .map(ss => { try { return Array.from(ss.cssRules).map(r => r.cssText).join('\n'); } catch(e){ return ''; } })
    .join('\n');

  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head>
    <meta charset="UTF-8">
    <title>Weekly Schedule — ${startFmt} to ${endFmt}</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      ${styles}
      @media print {
        @page { size: 8.5in 11in portrait; margin: 0.3in 0.25in; }
        body { background: #fff !important; padding: 0 !important; font-size: 8px; }
        .controls { display: none !important; }
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
      body { background: #fff; padding: 0.1in; font-size: 8px; }
      .schedule-table { font-size: 9px; }
      .col-name { width: 110px !important; }
    </style>
  </head><body>${body}<script>window.onload=function(){window.print();}<\/script></body></html>`);
  win.document.close();
}

// ── init ──────────────────────────────────────────────────────────────────
const now = new Date();
document.getElementById('monthInput').value =
  `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
fetchStaff(); // fetches staff then calls buildSchedule + populateWeekSelect
document.getElementById('monthInput').addEventListener('change', populateWeekSelect);
</script>
</body>
